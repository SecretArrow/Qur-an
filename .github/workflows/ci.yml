name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: Lint • Static • Unit • Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    outputs:
      artifact: app-debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: false

      - name: Install ktlint
        run: |
          curl -sSL -o /usr/local/bin/ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x /usr/local/bin/ktlint
          ktlint --version

      - name: Run ktlint (check)
        id: ktlint
        continue-on-error: true
        run: ktlint "app/src/**/*.kt" "app/src/**/*.kts" "*.kts" 2>&1 | tee ktlint.log

      - name: Auto-fix ktlint & re-run (push ke main saja)
        if: steps.ktlint.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[autofix]')
        run: |
          ktlint --format "app/src/**/*.kt" "app/src/**/*.kts" "*.kts" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[autofix] ktlint format (CI run ${{ github.run_number }})" || echo "tidak ada perubahan"
          git push origin main
          gh workflow run ci.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail bila ktlint masih gagal setelah autofix
        if: steps.ktlint.outcome == 'failure'
        run: |
          echo "::error::ktlint gagal. Pada push ke main, autofix sudah dijalankan; silakan lihat commit baru."
          exit 1

      - name: Dependency validation (resolusi konfigurasi runtime)
        run: ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath | tail -n 40

      - name: Static analysis (detekt) + Android Lint + Unit test + Debug build
        run: ./gradlew detekt lintDebug testDebugUnitTest assembleDebug --stacktrace

      - name: Upload lint & test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  e2e:
    name: E2E (instrumented, emulator)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: false

      - name: Jalankan instrumented test di emulator (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          channel: stable
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Auto-release APK & AAB
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: false

      - name: Siapkan keystore dari secret
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEYSTORE_READY=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_READY=false" >> $GITHUB_ENV
            echo "::warning::Secret keystore belum diisi — release memakai tanda tangan debug."
          fi

      - name: Build signed release (APK + AAB)
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Buat tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${VERSION_NAME}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
            echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
            echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          fi

      - name: Susun changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          git log --pretty=format:"- %s (%h)" "${PREV}..${TAG_NAME}" > CHANGELOG.txt || true
          if [ ! -s CHANGELOG.txt ]; then echo "- Rilis otomatis ${TAG_NAME}" > CHANGELOG.txt; fi

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Al-Qur'an Indonesia ${{ env.VERSION_NAME }}
          body_path: CHANGELOG.txt
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
